name: Deploy Backend to Dev

# Automatic dev deploys. Production is deliberately not reachable from here —
# it is deployed by hand through deploy-prod-backend.yml (workflow_dispatch).

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy Django Backend (dev)
    runs-on: ubuntu-latest
    # No `environment:` on purpose. This workflow runs on every push to main and
    # must only ever reach dev, so it is kept out of the prod environment that
    # deploy-prod-backend.yml uses. It reads DEV_-prefixed secrets for anything
    # that decides *which server* or *which database* is written to; those names
    # exist nowhere else, so a missing one fails the run instead of silently
    # falling back to the repo-level production values.
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Require dev deployment secrets
        env:
          DEV_BACKEND_FTP_HOST: ${{ secrets.DEV_BACKEND_FTP_HOST }}
          DEV_BACKEND_FTP_USERNAME: ${{ secrets.DEV_BACKEND_FTP_USERNAME }}
          DEV_BACKEND_FTP_PASSWORD: ${{ secrets.DEV_BACKEND_FTP_PASSWORD }}
          DEV_DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DEV_DB_USER: ${{ secrets.DEV_DB_USER }}
          DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          DEV_DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DEV_DB_PORT: ${{ secrets.DEV_DB_PORT }}
          DEV_DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
        run: |
          missing=""
          for name in DEV_BACKEND_FTP_HOST DEV_BACKEND_FTP_USERNAME DEV_BACKEND_FTP_PASSWORD \
                      DEV_DB_NAME DEV_DB_USER DEV_DB_PASSWORD DEV_DB_HOST DEV_DB_PORT \
                      DEV_DJANGO_SECRET_KEY
          do
            [ -n "${!name}" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing dev deployment secrets:$missing"
            echo "This workflow deploys to the dev server on every push to main."
            echo "It refuses to run without its own credentials, because the"
            echo "repo-level BACKEND_FTP_* / DB_* secrets are production's — using"
            echo "them here would auto-deploy every push straight to the live API,"
            echo "which is what it was mistakenly doing before."
            echo "Add the secrets above (dev cPanel FTP account + dev database),"
            echo "then re-run. Production deploys stay manual via deploy-prod-backend.yml."
            exit 1
          fi

          echo "All dev deployment secrets are present."

      - name: Verify requirements.txt
        run: |
          echo "Checking requirements.txt..."
          cat backend/requirements.txt
          
      - name: Create deployment package
        run: |
          cd backend
          # Create a clean deployment directory
          mkdir -p ../deploy_package
          
          # Copy all backend files except unnecessary ones
          rsync -av --progress . ../deploy_package \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude '.htaccess' \
            --exclude '.git' \
            --exclude 'db.sqlite3' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            --exclude 'media/uploads/*' \
            --exclude 'staticfiles/*'

          # Force Passenger to reload the Python app on next request.
          mkdir -p ../deploy_package/tmp
          echo "restart ${GITHUB_SHA} $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > ../deploy_package/tmp/restart.txt
          
          # List files to be deployed
          echo "Files to deploy:"
          ls -la ../deploy_package

      - name: Generate backend runtime env from GitHub config
        env:
          # Database and secret key are dev-only, with no fallback: a fallback
          # here would point the dev server at the production database.
          DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DB_USER: ${{ secrets.DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DB_PORT: ${{ secrets.DEV_DB_PORT }}
          DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          # Mail and URLs are not environment-critical, so the shared values
          # stand in when no dev-specific one is set.
          DJANGO_DEBUG: ${{ secrets.DEV_DJANGO_DEBUG || secrets.DJANGO_DEBUG }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.DEV_FRONTEND_URL || secrets.FRONTEND_URL }}
        run: |
          # Fail fast if mandatory secrets are empty.
          test -n "$DB_NAME" || { echo "DB_NAME is empty"; exit 1; }
          test -n "$DB_USER" || { echo "DB_USER is empty"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD is empty"; exit 1; }
          test -n "$DB_HOST" || { echo "DB_HOST is empty"; exit 1; }
          test -n "$DB_PORT" || { echo "DB_PORT is empty"; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo "DJANGO_SECRET_KEY is empty"; exit 1; }
          test -n "$EMAIL_BACKEND" || { echo "EMAIL_BACKEND is empty"; exit 1; }
          test -n "$EMAIL_HOST" || { echo "EMAIL_HOST is empty"; exit 1; }
          test -n "$EMAIL_PORT" || { echo "EMAIL_PORT is empty"; exit 1; }
          test -n "$EMAIL_HOST_USER" || { echo "EMAIL_HOST_USER is empty"; exit 1; }
          test -n "$EMAIL_HOST_PASSWORD" || { echo "EMAIL_HOST_PASSWORD is empty"; exit 1; }
          test -n "$DEFAULT_FROM_EMAIL" || { echo "DEFAULT_FROM_EMAIL is empty"; exit 1; }

          # Safe write via shell variables (avoids mangling secrets containing '$').
          {
            echo "DJANGO_ENV=production"   # runtime mode, not the target host
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            echo "DJANGO_DEBUG=${DJANGO_DEBUG:-false}"
            echo "EMAIL_BACKEND=$EMAIL_BACKEND"
            echo "EMAIL_HOST=$EMAIL_HOST"
            echo "EMAIL_PORT=$EMAIL_PORT"
            echo "EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}"
            echo "EMAIL_HOST_USER=$EMAIL_HOST_USER"
            echo "EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD"
            echo "DEFAULT_FROM_EMAIL=$DEFAULT_FROM_EMAIL"
            echo "FRONTEND_URL=$FRONTEND_URL"
          } > deploy_package/.env.production

          # runtime.env is deliberately NOT written. It was only ever a copy of
          # .env.production, which settings.py reads first, so nothing ever read
          # it — but the server's rule for hiding env files matches the leading
          # dot, so the copy was downloadable over HTTP with the database
          # password and secret key in it. Leaving it out of the package also
          # makes the next FTP sync delete the exposed copy from the server.
          echo "Wrote deploy_package/.env.production (DJANGO_SECRET_KEY length: ${#DJANGO_SECRET_KEY})"
          
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_BACKEND_FTP_HOST }}
          username: ${{ secrets.DEV_BACKEND_FTP_USERNAME }}
          password: ${{ secrets.DEV_BACKEND_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy_package/
          # Where the dev account's FTP home sits relative to the app root
          # that Passenger serves. On the production account the home *is* the
          # app root, so './' was right there; if the dev account differs, set
          # the DEV_BACKEND_FTP_SERVER_DIR variable rather than guessing — an
          # upload into a directory nothing serves looks exactly like a
          # successful deploy.
          server-dir: ${{ vars.DEV_BACKEND_FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/*.pyc
            **/*.pyo
            **/db.sqlite3
            **/*.log
            **/.DS_Store
            **/.htaccess
            
      - name: Deployment Summary
        run: |
          # Reports the upload only. Nothing here checks the running site, so a
          # green run means the files were transferred, not that the API picked
          # them up.
          echo "✅ Backend files uploaded to dev."
          echo "📦 Deployed from: backend/"
          echo "🎯 Target: dev cPanel FTP account (DEV_BACKEND_FTP_*)"
          echo "ℹ️  Production is deployed manually via deploy-prod-backend.yml."
