name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy Django Backend
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Verify requirements.txt
        run: |
          echo "Checking requirements.txt..."
          cat backend/requirements.txt
          
      - name: Create deployment package
        run: |
          cd backend
          # Create a clean deployment directory
          mkdir -p ../deploy_package
          
          # Copy all backend files except unnecessary ones
          rsync -av --progress . ../deploy_package \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude '.htaccess' \
            --exclude '.git' \
            --exclude 'db.sqlite3' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            --exclude 'media/uploads/*' \
            --exclude 'staticfiles/*'

          # Force Passenger to reload the Python app on next request.
          mkdir -p ../deploy_package/tmp
          echo "restart ${GITHUB_SHA} $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > ../deploy_package/tmp/restart.txt
          
          # List files to be deployed
          echo "Files to deploy:"
          ls -la ../deploy_package

      - name: Generate backend runtime env from GitHub config
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          # Fail fast if mandatory secrets are empty.
          test -n "$DB_NAME" || { echo "DB_NAME is empty"; exit 1; }
          test -n "$DB_USER" || { echo "DB_USER is empty"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD is empty"; exit 1; }
          test -n "$DB_HOST" || { echo "DB_HOST is empty"; exit 1; }
          test -n "$DB_PORT" || { echo "DB_PORT is empty"; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo "DJANGO_SECRET_KEY is empty"; exit 1; }
          test -n "$EMAIL_BACKEND" || { echo "EMAIL_BACKEND is empty"; exit 1; }
          test -n "$EMAIL_HOST" || { echo "EMAIL_HOST is empty"; exit 1; }
          test -n "$EMAIL_PORT" || { echo "EMAIL_PORT is empty"; exit 1; }
          test -n "$EMAIL_HOST_USER" || { echo "EMAIL_HOST_USER is empty"; exit 1; }
          test -n "$EMAIL_HOST_PASSWORD" || { echo "EMAIL_HOST_PASSWORD is empty"; exit 1; }
          test -n "$DEFAULT_FROM_EMAIL" || { echo "DEFAULT_FROM_EMAIL is empty"; exit 1; }

          # Safe write via shell variables (avoids mangling secrets containing '$').
          {
            echo "DJANGO_ENV=production"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            echo "DJANGO_DEBUG=${DJANGO_DEBUG:-false}"
            echo "EMAIL_BACKEND=$EMAIL_BACKEND"
            echo "EMAIL_HOST=$EMAIL_HOST"
            echo "EMAIL_PORT=$EMAIL_PORT"
            echo "EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}"
            echo "EMAIL_HOST_USER=$EMAIL_HOST_USER"
            echo "EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD"
            echo "DEFAULT_FROM_EMAIL=$DEFAULT_FROM_EMAIL"
            echo "FRONTEND_URL=$FRONTEND_URL"
          } > deploy_package/.env.production

          # runtime.env is deliberately NOT written. It was only ever a copy of
          # .env.production, which settings.py reads first, so nothing ever read
          # it — but the server's rule for hiding env files matches the leading
          # dot, so the copy was downloadable over HTTP with the database
          # password and secret key in it. Leaving it out of the package also
          # makes the next FTP sync delete the exposed copy from the server.
          echo "Wrote deploy_package/.env.production (DJANGO_SECRET_KEY length: ${#DJANGO_SECRET_KEY})"
          
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BACKEND_FTP_HOST }}
          username: ${{ secrets.BACKEND_FTP_USERNAME }}
          password: ${{ secrets.BACKEND_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy_package/
          # This FTP account's home is already the Django app root — the
          # listing from the run 154 probe shows passenger_wsgi/api/ at its top
          # level. Nesting a subdirectory here uploads into a folder nothing
          # serves, which is what run 163 did.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/*.pyc
            **/*.pyo
            **/db.sqlite3
            **/*.log
            **/.DS_Store
            **/.htaccess
            
      # Verifies the host these FTP credentials actually serve. This job runs
      # under the `prod` environment, and the marker written below is the one
      # api.breakthroughpublishers.com returns — so probing devapi here could
      # never pass, whatever the upload did. Override BACKEND_API_BASE_URL if
      # the credentials are ever repointed at another environment.
      - name: Verify the live API reflects this build
        env:
          BASE_URL: ${{ vars.BACKEND_API_BASE_URL || 'https://api.breakthroughpublishers.com' }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$GITHUB_SHA"
          echo "Verifying $BASE_URL"

          # Passenger reloads lazily, on the first request after tmp/restart.txt
          # changes, so the marker can lag the upload by a few seconds.
          marker=""
          for i in 1 2 3 4 5 6; do
            marker="$(curl -fsS --max-time 10 "$BASE_URL/tmp/restart.txt" || true)"
            echo "Attempt $i marker: $marker"
            if printf '%s' "$marker" | grep -q "$EXPECTED_SHA"; then
              break
            fi
            sleep 10
          done

          if ! printf '%s' "$marker" | grep -q "$EXPECTED_SHA"; then
            echo "::error::$BASE_URL/tmp/restart.txt did not update to this commit ($EXPECTED_SHA). The upload did not reach the directory this host serves — check server-dir against the FTP account's home."
            exit 1
          fi

          # A 404 means the running code predates these routes; a 5xx after the
          # marker moved almost always means the schema is behind the code.
          failed=0
          for path in \
            "/api/v1/books/?skip=0&limit=1" \
            "/api/v1/book-series/" \
            "/api/v1/proceedings/downloads/" \
            "/api/v1/careers/jobs"
          do
            code=000
            for attempt in 1 2 3; do
              # `|| true` so a connection failure reports 000 rather than
              # killing the step under `set -e` with no message.
              code="$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$BASE_URL$path" || true)"
              code="${code:-000}"
              case "$code" in 2*|3*|4*) [ "$code" = "404" ] || break ;; esac
              sleep 10
            done
            echo "$path -> HTTP $code"
            case "$code" in
              404)
                echo "::error::Route still missing after deploy: $BASE_URL$path"
                failed=1
                ;;
              5*|000)
                echo "::error::$BASE_URL$path returned $code. The code shipped but the request failed — check that migrations ran (see passenger_wsgi.py) and read stderr.log on the server."
                failed=1
                ;;
            esac
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: Deployment Summary
        env:
          BASE_URL: ${{ vars.BACKEND_API_BASE_URL || 'https://api.breakthroughpublishers.com' }}
        run: |
          echo "✅ Backend deployment completed and verified live."
          echo "📦 Deployed from: backend/"
          echo "🎯 Target: $BASE_URL (GitHub environment: prod)"
