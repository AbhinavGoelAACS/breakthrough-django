name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy Django Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Verify requirements.txt
        run: |
          echo "Checking requirements.txt..."
          cat backend/requirements.txt
          
      - name: Create deployment package
        run: |
          cd backend
          # Create a clean deployment directory
          mkdir -p ../deploy_package
          
          # Copy all backend files except unnecessary ones
          rsync -av --progress . ../deploy_package \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'db.sqlite3' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            --exclude 'media/uploads/*' \
            --exclude 'staticfiles/*'
          
          # List files to be deployed
          echo "Files to deploy:"
          ls -la ../deploy_package
          
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_package/
          server-dir: ${{ secrets.BACKEND_SERVER_DIR }}  # e.g., /home/username/public_html/backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/*.pyc
            **/*.pyo
            **/.env
            **/db.sqlite3
            **/*.log
            **/.DS_Store
            
      - name: Trigger cPanel Python App Restart (via SSH)
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.BACKEND_PATH }}
            
            # Activate virtual environment if exists
            if [ -d "venv" ]; then
              source venv/bin/activate
            fi
            
            # Install/update dependencies
            pip install -r requirements.txt --quiet
            
            # Run migrations
            python manage.py migrate --no-input
            
            # Collect static files
            python manage.py collectstatic --no-input
            
            # Restart the application
            touch tmp/restart.txt
            
            echo "Backend deployment complete!"
            
      - name: Deployment Summary
        run: |
          echo "✅ Backend deployment completed successfully!"
          echo "📦 Deployed from: backend/"
          echo "🎯 Target: cPanel server"
