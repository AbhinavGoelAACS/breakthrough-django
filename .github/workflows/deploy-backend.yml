name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: dev-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Django Backend
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Verify requirements.txt
        run: |
          echo "Checking requirements.txt..."
          cat backend/requirements.txt
          
      - name: Create deployment package
        run: |
          cd backend
          # Create a clean deployment directory
          mkdir -p ../deploy_package
          
          # Copy all backend files except unnecessary ones
          rsync -av --progress . ../deploy_package \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude '.htaccess' \
            --exclude '.git' \
            --exclude 'db.sqlite3' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            --exclude 'media/uploads/*' \
            --exclude 'staticfiles/*'
          
          # Bake a fresh Passenger restart trigger into the package. Uploading a
          # changed tmp/restart.txt makes cPanel/Passenger reload the app on the
          # next request via FTP alone — no SSH required. Without this, uploaded
          # code can sit on disk while the old process keeps serving in memory.
          mkdir -p ../deploy_package/tmp
          date -u +"restart %Y-%m-%dT%H:%M:%SZ" > ../deploy_package/tmp/restart.txt

          # List files to be deployed
          echo "Files to deploy:"
          ls -la ../deploy_package

      - name: Generate backend runtime env from GitHub config
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          # Fail fast if mandatory secrets are empty.
          test -n "$DB_NAME" || { echo "DB_NAME is empty"; exit 1; }
          test -n "$DB_USER" || { echo "DB_USER is empty"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD is empty"; exit 1; }
          test -n "$DB_HOST" || { echo "DB_HOST is empty"; exit 1; }
          test -n "$DB_PORT" || { echo "DB_PORT is empty"; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo "DJANGO_SECRET_KEY is empty"; exit 1; }
          test -n "$EMAIL_BACKEND" || { echo "EMAIL_BACKEND is empty"; exit 1; }
          test -n "$EMAIL_HOST" || { echo "EMAIL_HOST is empty"; exit 1; }
          test -n "$EMAIL_PORT" || { echo "EMAIL_PORT is empty"; exit 1; }
          test -n "$EMAIL_HOST_USER" || { echo "EMAIL_HOST_USER is empty"; exit 1; }
          test -n "$EMAIL_HOST_PASSWORD" || { echo "EMAIL_HOST_PASSWORD is empty"; exit 1; }
          test -n "$DEFAULT_FROM_EMAIL" || { echo "DEFAULT_FROM_EMAIL is empty"; exit 1; }

          # Safe write via shell variables (avoids mangling secrets containing '$').
          {
            echo "DJANGO_ENV=production"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            echo "DJANGO_DEBUG=${DJANGO_DEBUG:-false}"
            echo "EMAIL_BACKEND=$EMAIL_BACKEND"
            echo "EMAIL_HOST=$EMAIL_HOST"
            echo "EMAIL_PORT=$EMAIL_PORT"
            echo "EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}"
            echo "EMAIL_HOST_USER=$EMAIL_HOST_USER"
            echo "EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD"
            echo "DEFAULT_FROM_EMAIL=$DEFAULT_FROM_EMAIL"
            echo "FRONTEND_URL=$FRONTEND_URL"
          } > deploy_package/.env.production

          cp deploy_package/.env.production deploy_package/runtime.env

          echo "Wrote deploy_package/.env.production and deploy_package/runtime.env (DJANGO_SECRET_KEY length: ${#DJANGO_SECRET_KEY})"

      - name: Clear FTP sync-state (force a full, deterministic upload)
        env:
          FTP_HOST: ${{ secrets.BACKEND_FTP_HOST }}
          FTP_USER: ${{ secrets.BACKEND_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.BACKEND_FTP_PASSWORD }}
        run: |
          # FTP-Deploy-Action uploads only what it believes changed, tracked in a
          # state file on the server. When that state drifts the step reports
          # success while transferring nothing.
          #
          # This was removed on 2026-07-19 (e5b9160) and backend deploys silently
          # stopped landing that same day: the server's tmp/restart.txt sat at
          # 2026-07-18T19:02:01Z for 27 days while every run went green. Setting
          # state-name alone did not fix it; deleting the state does. Restored.
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" \
            -e "set ftp:ssl-allow false; rm -f .ftp-deploy-sync-state.json; rm -f .ftp-deploy-sync-state-v2.json; bye" \
            || echo "No existing sync-state to remove (ok) — continuing."

      # Workflow logs are not readable without repo auth, so these probes encode
      # their answer in the step CONCLUSION rather than in printed output: each
      # passes only if that candidate path holds the Django entrypoint.
      # Read-only except D, continue-on-error, removed once the path is known.
      - name: "PROBE A - app is in FTP home"
        continue-on-error: true
        env: {FTP_HOST: "${{ secrets.BACKEND_FTP_HOST }}", FTP_USER: "${{ secrets.BACKEND_FTP_USERNAME }}", FTP_PASS: "${{ secrets.BACKEND_FTP_PASSWORD }}"}
        run: lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "set ftp:ssl-allow false; ls passenger_wsgi.py; bye" | grep -q passenger_wsgi.py

      - name: "PROBE B - app is in public_html/backend"
        continue-on-error: true
        env: {FTP_HOST: "${{ secrets.BACKEND_FTP_HOST }}", FTP_USER: "${{ secrets.BACKEND_FTP_USERNAME }}", FTP_PASS: "${{ secrets.BACKEND_FTP_PASSWORD }}"}
        run: lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "set ftp:ssl-allow false; ls public_html/backend/passenger_wsgi.py; bye" | grep -q passenger_wsgi.py

      - name: "PROBE C - app is in BreakThrough"
        continue-on-error: true
        env: {FTP_HOST: "${{ secrets.BACKEND_FTP_HOST }}", FTP_USER: "${{ secrets.BACKEND_FTP_USERNAME }}", FTP_PASS: "${{ secrets.BACKEND_FTP_PASSWORD }}"}
        run: lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "set ftp:ssl-allow false; ls BreakThrough/passenger_wsgi.py; bye" | grep -q passenger_wsgi.py

      - name: "PROBE D - FTP home is what devapi serves"
        continue-on-error: true
        env: {FTP_HOST: "${{ secrets.BACKEND_FTP_HOST }}", FTP_USER: "${{ secrets.BACKEND_FTP_USERNAME }}", FTP_PASS: "${{ secrets.BACKEND_FTP_PASSWORD }}"}
        run: |
          echo "probe-$GITHUB_RUN_ID" > /tmp/probe.txt
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "set ftp:ssl-allow false; put /tmp/probe.txt -o deploy-probe.txt; bye"
          sleep 5
          curl -sf --max-time 20 "https://devapi.breakthroughpublishers.com/deploy-probe.txt" | grep -q "probe-$GITHUB_RUN_ID"

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BACKEND_FTP_HOST }}
          username: ${{ secrets.BACKEND_FTP_USERNAME }}
          password: ${{ secrets.BACKEND_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy_package/
          server-dir: ./
          # FTP-Deploy-Action only uploads what it believes changed, based on a
          # state file it keeps on the server. A stale state makes the step
          # report success while transferring nothing — which is how new
          # endpoints ended up 404ing with a green build. Naming the state
          # explicitly lets us force a full re-upload by bumping the suffix.
          # A missing state means "everything is new", so all files upload; it
          # does NOT delete anything on the server (never use
          # dangerous-clean-slate here — media/, .env and .htaccess are
          # deliberately excluded from the package and would be destroyed).
          state-name: .ftp-deploy-sync-state-v2.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/*.pyc
            **/*.pyo
            **/db.sqlite3
            **/*.log
            **/.DS_Store
            **/.htaccess
      # There is no SSH access on this cPanel account, so migrations cannot be
      # run from here. They are applied by api/apps.py::ApiConfig.ready() when
      # Passenger boots the app — the FTP upload of tmp/restart.txt above is
      # what triggers that reload. See DEPLOYMENT.md.

      - name: Verify the server actually received this deploy
        run: |
          # The failure mode this guards against is a green pipeline over a stale
          # server. tmp/restart.txt is baked fresh into every package, so if the
          # deployed copy does not match what we just built, nothing landed.
          expected="$(cat deploy_package/tmp/restart.txt)"
          echo "expected: $expected"

          for attempt in 1 2 3 4 5 6; do
            actual="$(curl -sf --max-time 20 https://devapi.breakthroughpublishers.com/tmp/restart.txt || true)"
            echo "attempt $attempt -> ${actual:-<no response>}"
            [ "$actual" = "$expected" ] && { echo "✅ server is serving this build"; exit 0; }
            sleep 10
          done

          echo "::error::Upload did not reach the server. tmp/restart.txt on the host does not match this build, so the running app is still on older code."
          exit 1

      - name: Deployment Summary
        run: |
          echo "✅ Backend deployment completed successfully!"
          echo "📦 Deployed from: backend/"
          echo "🎯 Target: cPanel server"
