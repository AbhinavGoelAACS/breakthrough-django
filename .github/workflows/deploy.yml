name: Deploy Full Application to cPanel

# Manual only. This workflow deploys BOTH tiers to the same cPanel
# directories as deploy-backend.yml / deploy-frontend.yml. When it also ran on
# push, two FTP sessions raced for the same server-dir and shared sync-state
# file on every commit, so uploads were silently skipped and the running app
# kept serving old code while every workflow reported success.
# Push deploys are handled by the two per-tier workflows; keep this as a
# deliberate "redeploy everything" button.
on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend'
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend'
        required: true
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

concurrency:
  group: full-app-deploy
  cancel-in-progress: false

jobs:
  # ============================================
  # BACKEND DEPLOYMENT
  # ============================================
  deploy-backend:
    name: Deploy Django Backend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.deploy_backend }}
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Create backend deployment package
        run: |
          mkdir -p deploy_backend
          rsync -av --progress backend/ deploy_backend/ \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude '.htaccess' \
            --exclude '.git' \
            --exclude 'db.sqlite3' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            --exclude 'media/uploads/*' \
            --exclude 'staticfiles/*' \
            --exclude 'tests/' \
            --exclude '*.sqlite3'

      - name: Generate backend runtime env from GitHub config
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          test -n "$DB_NAME" || { echo "DB_NAME is empty"; exit 1; }
          test -n "$DB_USER" || { echo "DB_USER is empty"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD is empty"; exit 1; }
          test -n "$DB_HOST" || { echo "DB_HOST is empty"; exit 1; }
          test -n "$DB_PORT" || { echo "DB_PORT is empty"; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo "DJANGO_SECRET_KEY is empty"; exit 1; }
          test -n "$EMAIL_BACKEND" || { echo "EMAIL_BACKEND is empty"; exit 1; }
          test -n "$EMAIL_HOST" || { echo "EMAIL_HOST is empty"; exit 1; }
          test -n "$EMAIL_PORT" || { echo "EMAIL_PORT is empty"; exit 1; }
          test -n "$EMAIL_HOST_USER" || { echo "EMAIL_HOST_USER is empty"; exit 1; }
          test -n "$EMAIL_HOST_PASSWORD" || { echo "EMAIL_HOST_PASSWORD is empty"; exit 1; }
          test -n "$DEFAULT_FROM_EMAIL" || { echo "DEFAULT_FROM_EMAIL is empty"; exit 1; }

          {
            echo "DJANGO_ENV=production"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            echo "DJANGO_DEBUG=${DJANGO_DEBUG:-false}"
            echo "EMAIL_BACKEND=$EMAIL_BACKEND"
            echo "EMAIL_HOST=$EMAIL_HOST"
            echo "EMAIL_PORT=$EMAIL_PORT"
            echo "EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}"
            echo "EMAIL_HOST_USER=$EMAIL_HOST_USER"
            echo "EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD"
            echo "DEFAULT_FROM_EMAIL=$DEFAULT_FROM_EMAIL"
            echo "FRONTEND_URL=$FRONTEND_URL"
          } > deploy_backend/.env.production

          cp deploy_backend/.env.production deploy_backend/runtime.env
            
      - name: Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BACKEND_FTP_HOST }}
          username: ${{ secrets.BACKEND_FTP_USERNAME }}
          password: ${{ secrets.BACKEND_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy_backend/
          server-dir: ./
          exclude: |
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/*.pyc
            **/.htaccess

      - name: Post-deployment setup via SSH
        if: ${{ env.HAS_SSH_KEY == 'true' }}
        env:
          HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home2/aacsjour/BreakThrough
            
            # Create virtualenv if not exists
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Run migrations
            python manage.py migrate --no-input
            
            # Collect static files
            python manage.py collectstatic --no-input --clear
            
            # Restart application
            touch tmp/restart.txt
            
            echo "✅ Backend deployment complete!"
            
  # ============================================
  # FRONTEND DEPLOYMENT
  # ============================================
  deploy-frontend:
    name: Build and Deploy React Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.deploy_frontend }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Create .env.production
        working-directory: frontend
        run: |
          cat > .env.production << EOF
          VITE_API_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME=BreakThrough
          VITE_APP_VERSION=${{ github.sha }}
          EOF
          
      - name: Build application
        working-directory: frontend
        run: npm run build
        
      - name: Create .htaccess for SPA
        run: |
          cat > frontend/dist/.htaccess << 'HTACCESS'
          RewriteEngine On
          RewriteBase /
          
          # Force HTTPS (uncomment in production)
          # RewriteCond %{HTTPS} !=on
          # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          
          # SPA Routing - serve index.html for all non-file requests
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
          
          # Security Headers
          <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set X-Frame-Options "SAMEORIGIN"
            Header set X-XSS-Protection "1; mode=block"
          </IfModule>
          
          # Compression
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/css application/json
            AddOutputFilterByType DEFLATE application/javascript text/xml application/xml
          </IfModule>
          
          # Caching
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/jpg "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType font/woff2 "access plus 1 year"
          </IfModule>
          HTACCESS
          
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FRONTEND_FTP_HOST }}
          username: ${{ secrets.FRONTEND_FTP_USERNAME }}
          password: ${{ secrets.FRONTEND_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./frontend/dist/
          server-dir: ./
          exclude: |
            **/.git*/**
            **/node_modules/**
            
  # ============================================
  # DEPLOYMENT SUMMARY
  # ============================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
      - name: Check deployment status
        run: |
          echo "========================================"
          echo "       DEPLOYMENT SUMMARY"
          echo "========================================"
          echo ""
          echo "Backend Status: ${{ needs.deploy-backend.result }}"
          echo "Frontend Status: ${{ needs.deploy-frontend.result }}"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          echo "========================================"
