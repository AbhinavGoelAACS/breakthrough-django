name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: dev-frontend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy React Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Create production environment file
        run: |
          cd frontend
          echo "VITE_API_URL=${{ secrets.VITE_API_BASE_URL }}" > .env.production
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env.production
          echo "VITE_APP_NAME=BreakThrough" >> .env.production
          
      - name: Build for production
        run: |
          cd frontend
          npm run build
          
      - name: List build output
        run: |
          echo "Build output:"
          ls -la frontend/dist/
          
      - name: Create .htaccess for SPA routing
        run: |
          cat > frontend/dist/.htaccess << 'EOF'
          # Enable RewriteEngine
          RewriteEngine On
          
          # Set the base directory
          RewriteBase /
          
          # Handle HTTPS redirect (optional - uncomment if needed)
          # RewriteCond %{HTTPS} !=on
          # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          
          # Handle Angular/React/Vue SPA routing
          # If the requested file or directory doesn't exist, serve index.html
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
          
          # Security Headers
          <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set X-Frame-Options "SAMEORIGIN"
            Header set X-XSS-Protection "1; mode=block"
            Header set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>
          
          # Enable GZIP compression
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/plain
            AddOutputFilterByType DEFLATE text/html
            AddOutputFilterByType DEFLATE text/xml
            AddOutputFilterByType DEFLATE text/css
            AddOutputFilterByType DEFLATE application/xml
            AddOutputFilterByType DEFLATE application/xhtml+xml
            AddOutputFilterByType DEFLATE application/rss+xml
            AddOutputFilterByType DEFLATE application/javascript
            AddOutputFilterByType DEFLATE application/x-javascript
            AddOutputFilterByType DEFLATE application/json
          </IfModule>
          
          # Cache static assets
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/jpg "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType application/pdf "access plus 1 month"
            ExpiresByType text/x-javascript "access plus 1 month"
            ExpiresByType application/x-shockwave-flash "access plus 1 month"
            ExpiresByType image/x-icon "access plus 1 year"
            ExpiresDefault "access plus 2 days"
          </IfModule>
          EOF
      - name: Resolve the directory the site actually serves
        id: target
        env:
          FTP_HOST: ${{ secrets.FRONTEND_FTP_HOST }}
          FTP_USER: ${{ secrets.FRONTEND_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FRONTEND_FTP_PASSWORD }}
          SITE_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          FTP_HOST="$(printf '%s' "$FTP_HOST" | tr -d '[:space:]' | sed -e 's#^ftps\{0,1\}://##' -e 's#/*$##')"

          run_ftp() {
            {
              echo "set ftp:ssl-allow false"
              echo "set net:timeout 20"
              echo "set net:max-retries 2"
              echo "set cmd:fail-exit false"
              echo "open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\""
              printf '%s\n' "$1"
              echo "bye"
            } > lftp.script
            lftp -f lftp.script
          }

          echo "FTP home and layout"
          run_ftp "pwd" > pwd.txt 2>&1
          run_ftp "ls -R" > find.txt 2>&1 || true
          head -200 find.txt || true

          candidates="./\npublic_html/\npublic_html/frontend/\npublic_html/dev/\nfrontend/\n"

          token="probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$token" > probe.txt

          found=""
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            run_ftp "put -O \"$dir\" probe.txt -o deploy-probe.txt" >/dev/null 2>&1
            if [ $? -ne 0 ]; then
              continue
            fi
            sleep 2
            body="$(curl -sf --max-time 10 "$SITE_URL/deploy-probe.txt" 2>/dev/null || true)"
            run_ftp "rm -f \"${dir}deploy-probe.txt\"" >/dev/null 2>&1 || true
            if [ "$body" = "$token" ]; then
              found="$dir"
              break
            fi
          done <<< "$(printf '%s' "$candidates")"

          if [ -z "$found" ]; then
            echo "::error::Could not resolve frontend document root. Check FRONTEND_FTP_* secrets and FRONTEND_URL." 
            exit 1
          fi

          echo "server_dir=$found" >> "$GITHUB_OUTPUT"
          
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FRONTEND_FTP_HOST }}
          username: ${{ secrets.FRONTEND_FTP_USERNAME }}
          password: ${{ secrets.FRONTEND_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./frontend/dist/
          server-dir: ${{ steps.target.outputs.server_dir }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            !**/.htaccess
            
      - name: Deployment Summary
        run: |
          echo "✅ Frontend deployment completed successfully!"
          echo "📦 Deployed from: frontend/dist/"
          echo "🎯 Target: cPanel server"
          echo "📁 Files deployed:"
          find frontend/dist -type f | wc -l
