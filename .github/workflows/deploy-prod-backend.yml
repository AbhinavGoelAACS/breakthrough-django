name: Deploy Backend to cPanel (Prod)

on:
  workflow_dispatch:

concurrency:
  group: prod-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Django Backend (Prod)
    runs-on: ubuntu-latest
    environment: prod

    env:
      SITE_URL: https://api.breakthroughpublishers.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify requirements.txt
        run: |
          echo "Checking requirements.txt..."
          cat backend/requirements.txt

      - name: Create deployment package
        run: |
          cd backend
          mkdir -p ../deploy_package

          rsync -av --progress . ../deploy_package \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude '.htaccess' \
            --exclude '.git' \
            --exclude 'db.sqlite3' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            --exclude 'media/uploads/*' \
            --exclude 'staticfiles/*'

          # Bake a fresh Passenger restart trigger into the package. Uploading a
          # changed tmp/restart.txt makes cPanel/Passenger reload the app on the
          # next request via FTP alone — no SSH required. Without this, uploaded
          # code can sit on disk while the old process keeps serving in memory.
          mkdir -p ../deploy_package/tmp
          date -u +"restart %Y-%m-%dT%H:%M:%SZ" > ../deploy_package/tmp/restart.txt

          echo "Files to deploy:"
          ls -la ../deploy_package

      - name: Generate backend runtime env from GitHub config
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          # Fail fast if mandatory secrets are empty.
          test -n "$DB_NAME" || { echo "DB_NAME is empty"; exit 1; }
          test -n "$DB_USER" || { echo "DB_USER is empty"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD is empty"; exit 1; }
          test -n "$DB_HOST" || { echo "DB_HOST is empty"; exit 1; }
          test -n "$DB_PORT" || { echo "DB_PORT is empty"; exit 1; }

          # Strip stray whitespace/newlines a pasted secret may carry. DB
          # identifiers never contain internal whitespace, so removing all of it
          # is safe and prevents a trailing newline from (a) failing the guard
          # below and (b) polluting the generated env file.
          DB_NAME="$(printf '%s' "$DB_NAME" | tr -d '[:space:]')"
          DB_USER="$(printf '%s' "$DB_USER" | tr -d '[:space:]')"
          DB_HOST="$(printf '%s' "$DB_HOST" | tr -d '[:space:]')"
          DB_PORT="$(printf '%s' "$DB_PORT" | tr -d '[:space:]')"

          # Guard: a prod deploy must target the PROD database. The value comes
          # from the 'prod' GitHub Environment's DB_NAME secret. If that secret
          # is missing/wrong it silently falls back to the dev DB
          # (aacsjour_breakthroughPy) and production ends up on dev data. Fail
          # loudly instead. Update EXPECTED_PROD_DB if the prod DB is ever renamed.
          EXPECTED_PROD_DB="aacsjour_breakthroughProd"
          if [ "$DB_NAME" != "$EXPECTED_PROD_DB" ]; then
            echo "::error::Prod deploy DB_NAME does not match the expected prod database. Check DB_NAME in the repo's 'prod' GitHub Environment (Settings -> Environments -> prod) for the wrong value or a stray newline/whitespace."
            exit 1
          fi

          test -n "$DJANGO_SECRET_KEY" || { echo "DJANGO_SECRET_KEY is empty"; exit 1; }
          test -n "$EMAIL_BACKEND" || { echo "EMAIL_BACKEND is empty"; exit 1; }
          test -n "$EMAIL_HOST" || { echo "EMAIL_HOST is empty"; exit 1; }
          test -n "$EMAIL_PORT" || { echo "EMAIL_PORT is empty"; exit 1; }
          test -n "$EMAIL_HOST_USER" || { echo "EMAIL_HOST_USER is empty"; exit 1; }
          test -n "$EMAIL_HOST_PASSWORD" || { echo "EMAIL_HOST_PASSWORD is empty"; exit 1; }
          test -n "$DEFAULT_FROM_EMAIL" || { echo "DEFAULT_FROM_EMAIL is empty"; exit 1; }

          # Safe write via shell variables (avoids mangling secrets containing '$').
          {
            echo "DJANGO_ENV=production"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            echo "DJANGO_DEBUG=${DJANGO_DEBUG:-false}"
            echo "EMAIL_BACKEND=$EMAIL_BACKEND"
            echo "EMAIL_HOST=$EMAIL_HOST"
            echo "EMAIL_PORT=$EMAIL_PORT"
            echo "EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}"
            echo "EMAIL_HOST_USER=$EMAIL_HOST_USER"
            echo "EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD"
            echo "DEFAULT_FROM_EMAIL=$DEFAULT_FROM_EMAIL"
            echo "FRONTEND_URL=$FRONTEND_URL"
          } > deploy_package/.env.production

          cp deploy_package/.env.production deploy_package/runtime.env

          echo "Wrote deploy_package/.env.production and deploy_package/runtime.env (DJANGO_SECRET_KEY length: ${#DJANGO_SECRET_KEY})"

      - name: Resolve the directory the site actually serves
        id: target
        env:
          FTP_HOST: ${{ secrets.BACKEND_FTP_HOST }}
          FTP_USER: ${{ secrets.BACKEND_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.BACKEND_FTP_PASSWORD }}
          SITE_URL: ${{ env.SITE_URL }}
          OVERRIDE: ${{ vars.BACKEND_FTP_SERVER_DIR }}
        run: |
          set +e
          set -uo pipefail

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          FTP_HOST="$(printf '%s' "$FTP_HOST" | tr -d '[:space:]' | sed -e 's#^ftps\{0,1\}://##' -e 's#/*$##')"

          run_ftp() {
            {
              echo "set ftp:ssl-allow false"
              echo "set net:timeout 20"
              echo "set net:max-retries 2"
              echo "set cmd:fail-exit false"
              echo "open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\""
              printf '%s\n' "$1"
              echo "bye"
            } > lftp.script
            lftp -f lftp.script
          }

          annotate() {
            python3 -c 'import sys; print("::notice title=" + sys.argv[1] + "::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$1"
          }

          run_ftp "pwd" > pwd.txt 2>&1
          home="$(cat pwd.txt)"
          case "$home" in
            *"Unknown command"*|*"Login failed"*|*"Fatal error"*|*"Name or service not known"*|"")
              printf '%s\n' "$home" | annotate "FTP connection failed"
              echo "::error::No FTP session could be opened; check BACKEND_FTP_HOST / BACKEND_FTP_USERNAME / BACKEND_FTP_PASSWORD"
              exit 1;;
          esac

          run_ftp "find --maxdepth 4 ." > find.txt 2>&1
          if [ ! -s find.txt ]; then
            run_ftp "ls -R" > find.txt 2>&1 || true
          fi

          discovered="$(grep -E 'passenger_wsgi\.py$' find.txt 2>/dev/null | sed -e 's#passenger_wsgi\.py$##' -e 's#^\./##' | sed -e 's#^$#./#')"

          if [ -n "${OVERRIDE:-}" ]; then
            candidates="${OVERRIDE%/}/"
          else
            candidates="$(printf '%s\n' $discovered "/home2/aacsjour/BreakThrough/" "/home2/aacsjour/" "/home2/aacsjour/public_html/" "/home2/aacsjour/devapi.breakthroughpublishers.com/" "./" "BreakThrough/" "public_html/" | awk 'NF && !seen[$0]++')"
          fi

          token="probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$token" > probe.txt

          found=""
          results=""
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            run_ftp "put -O \"$dir\" probe.txt -o deploy-probe.txt" >/dev/null 2>&1
            if [ $? -ne 0 ]; then
              results="${results}${dir} : not writable\n"
              continue
            fi
            sleep 3
            body="$(curl -sf --max-time 20 "$SITE_URL/deploy-probe.txt" 2>/dev/null || true)"
            run_ftp "rm -f \"${dir}deploy-probe.txt\"" >/dev/null 2>&1 || true
            if [ "$body" = "$token" ]; then
              results="${results}${dir} : SERVED\n"
              found="$dir"
              break
            fi
            results="${results}${dir} : written, not served\n"
          done <<< "$candidates"

          printf '%s' "$results" | annotate "probe results"

          if [ -z "$found" ]; then
            echo "::error::None of the probed directories is served at $SITE_URL. Set BACKEND_FTP_SERVER_DIR repo variable to the document root."
            exit 1
          fi

          echo "server_dir=$found" >> "$GITHUB_OUTPUT"

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BACKEND_FTP_HOST }}
          username: ${{ secrets.BACKEND_FTP_USERNAME }}
          password: ${{ secrets.BACKEND_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy_package/
          server-dir: ${{ steps.target.outputs.server_dir }}
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/*.pyc
            **/*.pyo
            **/db.sqlite3
            **/*.log
            **/.DS_Store
            **/.htaccess

      - name: Trigger cPanel Python App Restart (via SSH)
        if: ${{ env.HAS_SSH_KEY == 'true' }}
        env:
          HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /home2/aacsjour/BreakThrough

            if [ -d "venv" ]; then
              source venv/bin/activate
            fi

            pip install -r requirements.txt --quiet
            python manage.py migrate --no-input
            python manage.py collectstatic --no-input
            touch tmp/restart.txt

            echo "Backend deployment complete!"

      - name: Deployment Summary
        run: |
          echo "Backend prod deployment completed successfully!"
          echo "Deployed from: backend/"
          echo "Target: cPanel server"
